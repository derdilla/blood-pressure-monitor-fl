name: '📦 Packages'

on:
  push:
    branches:
      - 'main'
    paths:
      - "health_data_store/**"
      - "settings_builder/**"
      - "settings_annotation/**"
      - ".github/workflows/pkg-CI.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      settings_builder: ${{ steps.filter.outputs.settings_builder }}
      settings_annotation: ${{ steps.filter.outputs.settings_annotation }}
      health_data_store: ${{ steps.filter.outputs.health_data_store }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            pubspec.lock
            health_data_store
            settings_annotation
            settings_builder
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            settings_builder:
              - 'settings_builder/**'
              - 'pubspec.lock'
            settings_annotation:
              - 'settings_annotation/**'
              - 'pubspec.lock'
            health_data_store:
              - 'health_data_store/**'
              - 'pubspec.lock'
  test-health_data_store:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.health_data_store == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          pubspec.yaml
          pubspec.lock
          app
          health_data_store
          settings_annotation
          settings_builder
    - name: Extract Flutter version
      id: get_version
      run: |
        VERSION=$(sed -n -E "s/.*sdk:\s*\^(.*)/\1/p" pubspec.yaml)
        if [ -z "$VERSION" ]; then
          echo "Error: Could not find a dart version specified in pubspec.yaml."
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Setup dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ steps.get_version.outputs.version }}
    - run: sudo apt-get -y install libsqlite3-dev
    - name: Get dependencies
      run: |
        dart pub get --enforce-lockfile
        dart pub global activate coverage
      working-directory: ./health_data_store
    - name: Generate code
      run: dart run build_runner build
      working-directory: ./health_data_store
    - name: Run tests
      run: |
        dart test --coverage=coverage
        format_coverage --lcov --in=coverage --out=coverage.lcov --report-on=lib
      working-directory: ./health_data_store
    - uses: actions/upload-artifact@v4
      with:
        name: health_data_store-coverage
        path: health_data_store/coverage.lcov
  test-settings_annotation:
    runs-on: ubuntu-slim
    needs: changes
    if: ${{ needs.changes.outputs.settings_annotation == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            pubspec.yaml
            pubspec.lock
            app
            health_data_store
            settings_annotation
            settings_builder
      - name: Extract Flutter version
        id: get_version
        run: |
          # This is the same function f-droid uses to ensure their builds keep succeeding:
          # https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/com.derdilla.bloodPressureApp.yml
          VERSION=$(sed -n -E "s/.*flutter:\s*(.*)/\1/p" pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find a Flutter version specified in pubspec.yaml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.get_version.outputs.version }}
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
        working-directory: ./settings_annotation
      - run: dart analyze
        working-directory: ./settings_annotation
      - name: Format
        run: dart format --output show --set-exit-if-changed .
        working-directory: ./settings_annotation
