name: '📦 Packages'

on:
  push:
    branches:
      - 'main'
    paths:
      - "health_data_store/**"
      - "settings_builder/**"
      - "settings_annotation/**"
      - ".github/workflows/pkg-CI.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      settings_builder: ${{ steps.filter.outputs.settings_builder }}
      settings_annotation: ${{ steps.filter.outputs.settings_annotation }}
      health_data_store: ${{ steps.filter.outputs.health_data_store }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            pubspec.lock
            health_data_store
            settings_annotation
            settings_builder
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            settings_builder:
              - 'settings_builder/**'
              - 'pubspec.lock'
            settings_annotation:
              - 'settings_annotation/**'
              - 'pubspec.lock'
            health_data_store:
              - 'health_data_store/**'
              - 'pubspec.lock'
  test-health_data_store:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.health_data_store == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          flutter/
          pubspec.yaml
          pubspec.lock
          app
          health_data_store
          settings_annotation
          settings_builder
    - run: git submodule update --init --recursive
    - run: echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
    - run: sudo apt-get -y install libsqlite3-dev
    - run: make get-deps
    - name: Generate code
      run: dart run build_runner build
      working-directory: ./health_data_store
    - name: Run tests
      run: dart test --no-deps
      working-directory: ./health_data_store
  test-settings_annotation:
    runs-on: ubuntu-slim
    needs: changes
    if: ${{ needs.changes.outputs.settings_annotation == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            flutter/
            pubspec.yaml
            pubspec.lock
            app
            health_data_store
            settings_annotation
            settings_builder
      - run: git submodule update --init --recursive
      - run: echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
      - name: Disable analytics
        run: flutter config --no-analytics --suppress-analytics
      - run: make get-deps
      - run: flutter test
        working-directory: ./settings_annotation
      - run: dart analyze
        working-directory: ./settings_annotation
      - name: Format
        run: dart format --output show --set-exit-if-changed .
        working-directory: ./settings_annotation
